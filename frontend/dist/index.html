<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" data-state="arriving">
    <!-- Original artwork; same bird as the tray icon (internal/assets). -->
    <svg class="bird" id="bird" viewBox="0 0 200 200" role="img" aria-label="A small blue bird">
      <g class="bird-body">
        <g class="wing-pivot back">
          <path class="wing" d="M98 106 C 76 82 44 62 6 54 C 12 62 14 67 12 72 C 22 73 28 77 22 84 C 34 84 40 88 34 95 C 46 95 52 99 48 106 C 60 106 66 110 64 118 C 76 118 88 118 98 120 Z"/>
          <path class="quill" d="M88 104 C 66 88 46 76 24 68 M80 110 C 64 100 50 94 38 90"/>
        </g>
        <path class="tail" d="M72 134 C 54 140 34 146 12 148 C 20 154 22 158 18 165 C 32 165 40 162 44 170 C 56 162 66 156 80 150 Z"/>
        <g class="feet">
          <path d="M96 166 L88 182 M88 182 L78 180 M88 182 L84 191 M88 182 L95 190
                   M114 168 L108 184 M108 184 L98 183 M108 184 L105 193 M108 184 L115 192"/>
        </g>
        <ellipse class="body" cx="104" cy="132" rx="48" ry="40"/>
        <ellipse class="belly" cx="116" cy="142" rx="30" ry="24"/>
        <path class="tuft" d="M104 46 C 98 34 90 28 80 26 C 94 22 106 28 112 36 C 110 24 114 14 124 8 C 122 18 122 26 124 34 C 128 26 136 22 146 22 C 138 28 134 34 132 44 Z"/>
        <circle class="head" cx="122" cy="80" r="42"/>
        <g class="eye">
          <ellipse class="eye-white" cx="112" cy="72" rx="14" ry="17"/>
          <circle class="pupil" cx="116" cy="77" r="7"/>
          <circle class="sparkle" cx="118" cy="73" r="2.4"/>
          <ellipse class="lid" cx="112" cy="72" rx="15" ry="18"/>
        </g>
        <g class="eye">
          <ellipse class="eye-white" cx="141" cy="72" rx="12" ry="15"/>
          <circle class="pupil" cx="145" cy="77" r="6"/>
          <circle class="sparkle" cx="147" cy="73" r="2"/>
          <ellipse class="lid" cx="141" cy="72" rx="13" ry="16"/>
        </g>
        <!-- Beak, starting on the face between the eyes. -->
        <path class="beak" d="M121 94 C 134 82 164 84 190 98 C 166 110 140 113 125 107 C 118 104 117 98 121 94 Z"/>
        <g class="wing-pivot front">
          <path class="wing" d="M118 136 C146 116 172 108 198 100 C192 108 192 112 194 117 C184 119 182 123 186 128 C176 130 172 134 176 139 C166 141 160 145 162 151 C150 153 136 154 122 152 Z"/>
          <path class="quill" d="M130 138 C150 126 170 118 188 112 M134 146 C148 140 160 136 172 132"/>
        </g>
      </g>
    </svg>

    <section class="bubble" id="bubble" role="alertdialog" aria-modal="false"
             aria-labelledby="title" aria-describedby="message">
      <p class="badge" id="badge" hidden>Snoozed reminder</p>
      <h1 id="title"></h1>
      <p id="message"></p>
      <div class="actions" id="actions"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
